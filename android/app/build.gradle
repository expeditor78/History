plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.history7'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.history7.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        // Release-подпись берётся из переменных окружения (GitHub Secrets). В репозитории ничего не хранится.
        // Если ANDROID_KEYSTORE_PATH не задан, конфигурация всё равно работает (release будет без подписи).
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Сайт лежит в ../../site — берём его как assets, без копирования.
    sourceSets {
        main {
            assets.srcDirs = ['../../site']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
