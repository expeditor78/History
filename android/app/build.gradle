plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.history7'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.history7.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Сайт лежит в ../../site — берём его как assets, без копирования.
    sourceSets {
        main {
            assets.srcDirs = ['../../site']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
