name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'site/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk History7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: History7-apk
          path: History7.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: History7 APK #${{ github.run_number }}
          files: History7.apk
          fail_on_unmatched_files: true
      - name: Commit APK to repo
        run: |
          mkdir -p apk
          cp History7.apk apk/History7.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add apk/History7.apk
          git commit -m "Build APK" || exit 0
          git push
