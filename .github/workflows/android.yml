name: Build Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'site/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Секреты хранятся в Environment с именем ANDROID_KEYSTORE_B64
    environment: ANDROID_KEYSTORE_B64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Secret $v не задан (Settings → Secrets and variables → Actions)"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/history7-release.jks"
          chmod 600 "$RUNNER_TEMP/history7-release.jks"
          
      - name: Build release APK and AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/history7-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -x android/gradlew ]; then GRADLE="./gradlew"; else GRADLE="gradle"; fi
          echo "Gradle: $GRADLE"
          $GRADLE -p android assembleRelease bundleRelease --no-daemon

      - name: Prepare artifacts
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk History7.apk
          cp android/app/build/outputs/bundle/release/app-release.aab History7.aab
          ls -l History7.apk History7.aab

      - name: Verify APK signature (apksigner)
        shell: bash
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs History7.apk | tee apksigner.log
          if grep -qi "CN=Android Debug" apksigner.log; then
            echo "::error::APK подписан debug-ключом"
            exit 1
          fi
          echo "=== SHA-256 сертификата подписи ==="
          grep -i "SHA-256 digest" apksigner.log

      - name: Verify AAB signature (keytool)
        shell: bash
        run: |
          keytool -printcert -jarfile History7.aab | grep -E "Owner|SHA256"

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/history7-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: History7-release
          path: |
            History7.apk
            History7.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: History7 #${{ github.run_number }}
          files: |
            History7.apk
            History7.aab
          fail_on_unmatched_files: true
